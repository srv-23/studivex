<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studivex - Student Productivity Extension">
  <title>Studivex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div>
          <h1 class="header-title">📚 Studivex</h1>
          <p class="header-subtitle">Stay focused, stay organized</p>
        </div>
        <button id="darkModeBtn" class="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          🌙
        </button>
      </div>
    </header>

    <!-- Task Input Section -->
    <section class="input-section" aria-label="Add new task">
      <div class="input-group">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="Add a task..."
          aria-label="Task title input"
          maxlength="150"
        />
        <select
          id="prioritySelect"
          class="priority-select"
          aria-label="Task priority"
        >
          <option value="1">Low</option>
          <option value="2" selected>Medium</option>
          <option value="3">High</option>
          <option value="4">Critical</option>
        </select>
      </div>
      <textarea
        id="descriptionInput"
        class="task-description-input"
        placeholder="Add description (optional)..."
        aria-label="Task description input"
        maxlength="300"
        rows="2"
      ></textarea>
      <div class="input-group">
        <input
          type="number"
          id="timeEstimateInput"
          class="time-estimate-input"
          placeholder="Minutes (optional)"
          aria-label="Task time estimate"
          min="1"
          max="480"
        />
        <input
          type="date"
          id="dueDateInput"
          class="due-date-input"
          aria-label="Task due date"
        />
        <button
          id="addTaskBtn"
          class="btn btn-primary"
          aria-label="Add task"
        >
          + Add Task
        </button>
      </div>
    </section>

    <!-- Tasks List Section -->
    <section class="tasks-section" aria-label="Task list">
      <div class="tasks-header">
        <h2 class="tasks-title">Tasks</h2>
        <span class="task-count" id="taskCount" aria-live="polite">0</span>
      </div>

      <!-- Filter and Sort Controls -->
      <div class="filter-sort-controls">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Done</button>
        </div>
        <select id="sortSelect" class="sort-select" aria-label="Sort tasks">
          <option value="priority">Sort: Priority</option>
          <option value="date">Sort: Due Date</option>
          <option value="created">Sort: Created</option>
          <option value="time">Sort: Time Est.</option>
        </select>
      </div>

      <div id="tasksList" class="tasks-list" role="list">
        <div class="empty-state">
          <p>🎯 No tasks yet</p>
          <p class="empty-state-hint">Add a task to get started!</p>
        </div>
      </div>
    </section>

    <!-- Footer with Quick Actions -->
    <footer class="footer">
      <button
        id="settingsBtn"
        class="btn btn-secondary"
        aria-label="Open settings"
      >
        ⚙️ Settings
      </button>
      <button
        id="clearBtn"
        class="btn btn-secondary"
        aria-label="Clear completed tasks"
      >
        ✓ Clear Completed
      </button>
    </footer>
  </div>

  <!-- Focus Session Timer Modal -->
  <div id="focusModal" class="focus-modal hidden">
    <div class="focus-modal-content">
      <div class="focus-modal-header">
        <h2>⏱️ Focus Session</h2>
        <button id="focusCloseBtn" class="modal-close" aria-label="Close focus session">&times;</button>
      </div>
      <div class="focus-modal-body">
        <p class="focus-task-title" id="focusTaskTitle"></p>
        
        <div class="timer-display">
          <div id="timerValue" class="timer-value">00:00</div>
          <p class="timer-label">Time Remaining</p>
        </div>

        <div class="timer-controls">
          <button id="timerStartBtn" class="btn btn-primary timer-btn">Start</button>
          <button id="timerPauseBtn" class="btn btn-secondary timer-btn" disabled>Pause</button>
          <button id="timerResetBtn" class="btn btn-secondary timer-btn">Reset</button>
        </div>

        <div class="timer-progress">
          <div id="timerProgressBar" class="progress-bar"></div>
        </div>

        <p class="timer-note">Focus on your task. Timer will notify you when time is up.</p>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
